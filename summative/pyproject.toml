[project]
name = "linear-regression-model"
version = "0.1.0"
description = "Regression model, FastAPI service and Flutter app for the ALU summative"
requires-python = ">=3.13"
dependencies = [
    "joblib>=1.6.0",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
]
